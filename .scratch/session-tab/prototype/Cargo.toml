# THROWAWAY probe for ticket 06 (left sidebar's fifth tab: 会话).
#
# Deliberately its own workspace root so it never joins the heng package graph:
# the repo-root Cargo.toml, src/ and Cargo.lock are untouched by this crate.
# `ratatui` is the only dependency and it is already in the local registry
# (heng depends on it), so `cargo build --offline` resolves.
[package]
name = "session-tab-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
ratatui = "0.30"
